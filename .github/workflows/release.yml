name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: rusty_comic_reader
            asset_name: comic-reader-linux-x86_64
          - os: windows-latest
            binary_name: rusty_comic_reader.exe
            asset_name: comic-reader-windows-x86_64.exe
          - os: macos-latest
            binary_name: rusty_comic_reader
            asset_name: comic-reader-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libx11-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten downloaded artifacts
        run: |
          mkdir release
          find dist -type f -exec cp {} release/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
