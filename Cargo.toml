[package]
name = "rusty_comic_reader"
version = "0.1.0"
edition = "2024"

[dependencies]
alphanumeric-sort = "1.5.8"
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.36.1"
egui = "0.36.1"
egui-winit = "0.36.1"
egui_extras = "0.36.1"
image = "0.25.10"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust = "0.6.1"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unrar = "0.5.8"
walkdir = "2.5.0"
zip = "8.6.0"

# Image decoding (jpeg-decoder, sevenz-rust, etc.) is unusably slow without
# optimizations — a single archive load took 70-90s in plain debug mode.
# Optimize dependencies while keeping our own crate's debug info/fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
