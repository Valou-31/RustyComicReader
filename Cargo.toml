[package]
name = "rusty_comic_reader"
version = "0.1.10"
edition = "2024"

[dependencies]
alphanumeric-sort = "1.5.8"
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.36.1"
egui = "0.36.1"
egui-winit = "0.36.1"
egui_extras = "0.36.1"
flate2 = "1.1.10"
image = "0.25.10"
pollster = "1.0.1"
rfd = "0.17.2"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust = "0.6.1"
tar = "0.4.46"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unrar = "0.5.8"
ureq = "3.4.2"
walkdir = "2.5.0"
zip = "8.6.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

# Pinned to the same versions `eframe`'s own macOS backend already resolves
# to, so this doesn't pull in a second copy of objc2/objc2-app-kit/
# objc2-foundation — see `platform::macos` for what these are for.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["std", "NSApplication", "NSResponder"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"]

# Image decoding (jpeg-decoder, sevenz-rust, etc.) is unusably slow without
# optimizations — a single archive load took 70-90s in plain debug mode.
# Optimize dependencies while keeping our own crate's debug info/fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
