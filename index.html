<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Comic Reader</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1c1c1c;
        }
        #comic_reader_canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- `data-target-name` picks the `rusty_comic_reader_lib` cdylib specifically —
         the native binary target (also built, and stubbed out for wasm32) would
         otherwise be an ambiguous second candidate; see Cargo.toml's `[lib]`. -->
    <link data-trunk rel="rust" data-target-name="rusty_comic_reader_lib" data-wasm-opt="2" />
</head>
<body>
    <canvas id="comic_reader_canvas"></canvas>
</body>
</html>
